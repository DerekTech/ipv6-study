<line x1="64" x2="696" y1="246.0" y2="246.0" stroke="#e1e0d9" stroke-width="1"/>
<text x="54" y="250.0" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="12" fill="#898781" text-anchor="end" style="font-variant-numeric: tabular-nums">50%</text>
<line x1="64" x2="696" y1="181.0" y2="181.0" stroke="#e1e0d9" stroke-width="1"/>
