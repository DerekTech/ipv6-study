<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 440" width="720" height="440" role="img" aria-labelledby="t d">
<title id="t">IPv6 reachability: Tranco top 1,000 vs 50 scraping targets</title>
<desc id="d">Bar chart of IPv6 reachability. Of the 725 websites in the Tranco top 1,000, 54.1% publish an IPv6 address and 49.1% loaded over IPv6 from both servers. Of the 44 commonly scraped sites, 31.8% publish an IPv6 address and 29.5% loaded over IPv6 from both servers.</desc>
<rect width="720" height="440" fill="#fcfcfb"/>
<text x="24" y="34" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="19" font-weight="600" fill="#0b0b0b">IPv6 reachability: popular sites vs scraping targets</text>
<text x="24" y="58" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="13" fill="#52514e">Share of sites, tested from Frankfurt, DE and Atlanta, US, 2026-10-11 to 2026-10-12</text>
<rect x="24" y="74" width="12" height="12" rx="3" fill="#2a78d6"/>
<text x="42" y="84" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="13" fill="#52514e">Publishes an IPv6 address (AAAA record)</text>
<rect x="324" y="74" width="12" height="12" rx="3" fill="#eb6834"/>
<text x="342" y="84" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="13" fill="#52514e">Loaded over IPv6 from both servers</text>
