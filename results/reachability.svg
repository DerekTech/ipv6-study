<text x="54" y="380.0" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="12" fill="#898781" text-anchor="end" style="font-variant-numeric: tabular-nums">0%</text>
<line x1="64" x2="696" y1="311.0" y2="311.0" stroke="#e1e0d9" stroke-width="1"/>
